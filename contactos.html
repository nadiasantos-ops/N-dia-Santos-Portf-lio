<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <meta name="description" content="Entra em contacto com Nádia Santos para novos projetos de design e multimédia.">
    <link rel="icon" href="IMAGENS/Logotipo.svg" type="image/png">

</head>
<body class="contact-page">

    <header role="banner">
        <div class="container header-content">
            <a href="index.html" aria-label="Voltar ao início">
                <img src="IMAGENS/Logotipo.svg" alt="Logótipo DT" class="logo">
            </a>
            <nav aria-label="Navegação Principal">
                <ul class="nav-list">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="projetos.html">Projetos</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="contactos.html" class="nav-contact active" aria-current="page">Contactos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content">
       <section class="contact-section">
            <div class="container">
                <div class="contact-wrapper"> 
                    <div class="contact-grid">
                        
                        <div class="form-side">
                            <h1 id="contact-title" class="main-heading">contactos</h1>
                            <p class="sub-heading">VAMOS CRIAR PROJETOS JUNTOS!</p>
        
                            <form action="https://formspree.io/f/mvzwoqlp" method="POST" class="styled-form">
                                <div class="form-group">
                                    <label for="assunto">Assunto</label>
                                    <input type="text" id="assunto" name="assunto" required>
                                </div>
        
                                <div class="form-group">
                                    <label for="email">Email</label>
                                    <input type="email" id="email" name="email" required>
                                </div>
        
                                <div class="form-group">
                                    <label for="mensagem">Mensagem</label>
                                    <span class="label-caption">Detalhe ao máximo a sua ideia de projeto</span>
                                    <textarea id="mensagem" name="mensagem" rows="6" required></textarea>
                                </div>
        
                                <button type="submit" class="btn-submit">Enviar</button>
                            </form>
                        </div>
        
        <aside class="social-side" aria-label="Redes Sociais">
    <div class="floating-icons">
       
        <a href="https://www.instagram.com/nadiasantos_designer/" aria-label="Instagram"><img src="IMAGENS/Instagram icon art.png" alt="Ícone 3D Instagram" class="icon-ig"></a>
        <br>
        <a href="https://www.behance.net/nadiasantosart" aria-label="Behance"><img src="IMAGENS/Behance icon art.png" alt="Ícone 3D Behance" class="icon-be"></a>
        <div class="li-wrapper">
            <br>
            <a href="https://www.linkedin.com/in/nádia-santos-design" aria-label="LinkedIn"><img src="IMAGENS/LinkedIn icon art.png" alt="Ícone 3D LinkedIn" class="icon-li"></a>
            
            <p class="click-more">Clica para saber mais!</p>
        </div>
    </div>
</aside>
                        
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer role="contentinfo">
        <div class="container">
            <h2 class="footer-cta">
                <a href="contactos.html" style="color: inherit; text-decoration: none;">VAMOS CONVERSAR ?</a>
            </h2>
            <nav aria-label="Navegação de Rodapé">

                </ul>
            </nav>
             <div class="social-icons">
                <a href="https://www.instagram.com/nadiasantos_designer/" aria-label="Instagram"><img src="IMAGENS/Instagram Icon.svg" alt="Instagram"></a>
                <a href="https://www.linkedin.com/in/nádia-santos-design/" aria-label="LinkedIn"><img src="IMAGENS/LinkedIn Icon.svg" alt="LinkedIn"></a>
                <a href="contactos.html" aria-label="WhatsApp"><img src="IMAGENS/Whatsapp.svg" alt="WhatsApp"></a>

            </div>
